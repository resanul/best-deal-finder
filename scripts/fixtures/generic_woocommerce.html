<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://example.com/wp-content/plugins/woocommerce/assets/css/woocommerce.css">
    <title>AMD Ryzen 5 5600 - BD Tech Store (WooCommerce)</title>
</head>
<body class="woocommerce single-product">
    <div class="product type-product status-publish" itemscope itemtype="http://schema.org/Product">
        <h1 class="product_title entry-title" itemprop="name">AMD Ryzen 5 5600 6-Core AM4 Processor (Boxed)</h1>
        
        <div itemprop="offers" itemscope itemtype="http://schema.org/Offer">
            <p class="price">
                <del aria-hidden="true">
                    <span class="woocommerce-Price-amount amount">
                        <bdi><span class="woocommerce-Price-currencySymbol">&#2547;</span>15,800</bdi>
                    </span>
                </del>
                <ins>
                    <span class="woocommerce-Price-amount amount">
                        <bdi><span class="woocommerce-Price-currencySymbol">&#2547;</span>13,750</bdi>
                    </span>
                </ins>
                <meta itemprop="price" content="13750" />
                <meta itemprop="priceCurrency" content="BDT" />
                <link itemprop="availability" href="http://schema.org/InStock" />
            </p>
        </div>

        <div class="woocommerce-product-details__short-description">
            <p>AMD Ryzen 5 5600 Desktop CPU with Wraith Stealth cooler.</p>
        </div>
        <p class="stock in-stock">24 in stock</p>
    </div>
</body>
</html>
